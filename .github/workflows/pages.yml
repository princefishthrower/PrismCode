name: Deploy PrismCode to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - uses: actions/configure-pages@v6
      - run: npm ci
      # The site copies fonts/, so build it from source first, as the release does.
      - name: Build the fonts from source
        run: npm run build
      - name: Compare the build with the committed files
        run: |
          if [ -n "$(git status --porcelain -- fonts previews)" ]; then
            git status --short -- fonts previews
            echo "::error::fonts/ or previews/ differ from a fresh build of this commit. Run npm run build and commit the result."
            exit 1
          fi
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out
      - uses: actions/deploy-pages@v5
        id: deployment
